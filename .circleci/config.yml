version: 2.1

executors:
  tent-base:
    docker:
      - image: darthjee/circleci_tent-base:0.0.1
  node:
    docker:
      - image: darthjee/circleci_node:0.2.1
  scripts:
    docker:
      - image: darthjee/scripts:0.6.0
  machine:
    machine:
      image: ubuntu-2204:current

commands:
  prepare_source:
    description: Checkout and keep only the source/ folder at the root
    steps:
      - checkout
      - run:
          name: Remove other folders
          command: rm -rf dev
      - run:
          name: Set folder
          command: mv source old; mv old/* ./; rm -rf old;

  prepare_dev_folder:
    description: Checkout and keep only the given dev/ subfolder at the root
    parameters:
      folder:
        type: string
    steps:
      - checkout
      - run:
          name: Remove other folders
          command: rm -rf source
      - run:
          name: Set folder
          command: mv << parameters.folder >>/* ./; rm -rf dev;

  composer_setup:
    description: Copy pre-installed vendor folder and run composer install
    steps:
      - run:
          name: Copy dependencies
          command: cp /home/circleci/vendor/ ./vendor/ -R
      - run:
          name: composer install
          command: composer install

  upload_codacy_coverage:
    description: Upload a partial coverage report to Codacy
    parameters:
      report:
        type: string
    steps:
      - run:
          name: Upload coverage to Codacy
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -r << parameters.report >>

  docker_login:
    description: Log in to Docker Hub
    steps:
      - run:
          name: Docker login
          command: echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

  setup_qemu:
    description: Install QEMU binfmt handlers for cross-architecture builds
    steps:
      - run:
          name: Set up QEMU
          command: docker run --privileged --rm tonistiigi/binfmt --install all

  setup_buildx:
    description: Create and select a buildx docker-container builder (needed to push by digest)
    steps:
      - run:
          name: Set up buildx builder
          command: docker buildx create --use --name tent-builder

jobs:
  unit_test:
    docker:
      - image: darthjee/circleci_tent-base:0.0.1
      - image: kennethreitz/httpbin
        name: httpbin
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Tests
          command: composer coverage
      - upload_codacy_coverage:
          report: coverage/clover.xml

  checks:
    executor: tent-base
    steps:
      - prepare_source
      - composer_setup
      - run:
          name: Run Lint
          command: composer lint

  dev_api_test:
    docker:
      - image: darthjee/circleci_tent-base:0.0.1
        environment:
          API_DEV_MYSQL_HOST: mysql
          API_DEV_MYSQL_PORT: 3306
          API_DEV_MYSQL_USER: tent
          API_DEV_MYSQL_PASSWORD: tent
          API_DEV_MYSQL_TEST_DATABASE: tent
      - image: cimg/mysql:8.0
        name: mysql
        environment:
          MYSQL_DATABASE: tent
          MYSQL_USER: tent
          MYSQL_PASSWORD: tent
          MYSQL_ROOT_PASSWORD: tent
    steps:
      - prepare_dev_folder:
          folder: dev/api
      - composer_setup
      - run:
          name: Wait for DB
          command: php ./bin/wait_for_database.php
      - run:
          name: Ensure database exists
          command: php ./bin/create_databases.php
      - run:
          name: Migrate database
          command: php ./bin/migrate_databases.php
      - run:
          name: Tests
          command: composer coverage
      - upload_codacy_coverage:
          report: coverage/clover.xml

  dev_api_checks:
    executor: tent-base
    steps:
      - prepare_dev_folder:
          folder: dev/api
      - composer_setup
      - run:
          name: Run Lint
          command: composer lint

  dev_frontend_test:
    executor: node
    steps:
      - prepare_dev_folder:
          folder: dev/frontend
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Tests
          command: npm run coverage
      - upload_codacy_coverage:
          report: coverage/lcov.info

  dev_frontend_checks:
    executor: node
    steps:
      - prepare_dev_folder:
          folder: dev/frontend
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Check JS Lint
          command: npm run lint

  coverage_finalize:
    executor: tent-base
    steps:
      - run:
          name: Finalize coverage on Codacy
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) final

  build-and-release-package:
    executor: machine
    steps:
      - checkout
      - run:
          name: Create release package
          command: ./scripts/upload_release_package.sh build
      - run:
          name: Upload release package
          command: ./scripts/upload_release_package.sh release

  release-digest:
    executor: machine
    parameters:
      target:
        type: enum
        enum: [base, tent, tent-test]
      arch:
        type: enum
        enum: [amd64, arm64]
    steps:
      - checkout
      - when:
          condition:
            equal: [arm64, << parameters.arch >>]
          steps:
            - setup_qemu
      - setup_buildx
      # push-digest pushes as part of the build, so log in first.
      - docker_login
      - run:
          name: Docker build and push by digest
          command: make ci-push-digest-<< parameters.target >> ARCH=<< parameters.arch >> VERSION=${CIRCLE_TAG:-latest}
      - run:
          name: Docker check pushed digest
          command: make ci-check-digest-<< parameters.target >> ARCH=<< parameters.arch >> VERSION=${CIRCLE_TAG:-latest}
      - persist_to_workspace:
          root: .
          paths:
            - digests

  release-merge:
    executor: machine
    parameters:
      target:
        type: enum
        enum: [base, tent, tent-test]
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_buildx
      - docker_login
      - run:
          name: Docker merge multi-arch manifest
          command: make ci-merge-<< parameters.target >> VERSION=${CIRCLE_TAG:-latest}

  verify:
    executor: machine
    parameters:
      target:
        type: enum
        enum: [base, tent, tent-test]
      arch:
        type: enum
        enum: [amd64, arm64]
    steps:
      - checkout
      - when:
          condition:
            equal: [arm64, << parameters.arch >>]
          steps:
            - setup_qemu
      - setup_buildx
      - run:
          name: Docker build (no push) and check
          command: make ci-verify-<< parameters.target >> ARCH=<< parameters.arch >>

  update-description:
    executor: scripts
    steps:
      - checkout
      - run:
          name: Docker push description
          command: /bin/sh /home/scripts/sbin/docker_hub.sh login_and_push_description darthjee/tent DOCKERHUB_DESCRIPTION.md

all_tags: &all_tags
  tags:
    only: /.*/

release_filters: &release_filters
  tags:
    only: /.*/
  branches:
    ignore: /.*/

all_checks: &all_checks
  [unit_test, checks, dev_api_test, dev_api_checks, dev_frontend_test, dev_frontend_checks]

workflows:
  test-and-release:
    jobs:
      - unit_test:
          filters: *all_tags
      - checks:
          filters: *all_tags
      - dev_api_test:
          filters: *all_tags
      - dev_api_checks:
          filters: *all_tags
      - dev_frontend_test:
          filters: *all_tags
      - dev_frontend_checks:
          filters: *all_tags
      - coverage_finalize:
          requires: [unit_test, dev_api_test, dev_frontend_test]
          filters: *all_tags
      - build-and-release-package:
          requires: *all_checks
          filters: *release_filters
      # Branch-level verify: build and check with no push (branches only).
      - verify:
          name: verify-base-linux
          target: base
          arch: amd64
      - verify:
          name: verify-base-macos
          target: base
          arch: arm64
      - verify:
          name: verify-tent-linux
          target: tent
          arch: amd64
          requires: *all_checks
      - verify:
          name: verify-tent-macos
          target: tent
          arch: arm64
          requires: *all_checks
      - verify:
          name: verify-tent-test-linux
          target: tent-test
          arch: amd64
          requires: *all_checks
      - verify:
          name: verify-tent-test-macos
          target: tent-test
          arch: arm64
          requires: *all_checks
      # Tag release: push each arch by digest, check it, then merge.
      - release-digest:
          name: release-digest-base-linux
          target: base
          arch: amd64
          requires: *all_checks
          filters: *release_filters
      - release-digest:
          name: release-digest-base-macos
          target: base
          arch: arm64
          requires: *all_checks
          filters: *release_filters
      - release-merge:
          name: release-merge-base
          target: base
          requires: [release-digest-base-linux, release-digest-base-macos]
          filters: *release_filters
      - release-digest:
          name: release-digest-tent-linux
          target: tent
          arch: amd64
          requires: *all_checks
          filters: *release_filters
      - release-digest:
          name: release-digest-tent-macos
          target: tent
          arch: arm64
          requires: *all_checks
          filters: *release_filters
      - release-merge:
          name: release-merge-tent
          target: tent
          requires: [release-digest-tent-linux, release-digest-tent-macos]
          filters: *release_filters
      - release-digest:
          name: release-digest-tent-test-linux
          target: tent-test
          arch: amd64
          requires: [unit_test, checks, dev_api_test, dev_api_checks, dev_frontend_test, dev_frontend_checks, release-merge-base]
          filters: *release_filters
      - release-digest:
          name: release-digest-tent-test-macos
          target: tent-test
          arch: arm64
          requires: [unit_test, checks, dev_api_test, dev_api_checks, dev_frontend_test, dev_frontend_checks, release-merge-base]
          filters: *release_filters
      - release-merge:
          name: release-merge-tent-test
          target: tent-test
          requires: [release-digest-tent-test-linux, release-digest-tent-test-macos]
          filters: *release_filters
      - update-description:
          requires: [release-merge-tent]
          filters: *release_filters
